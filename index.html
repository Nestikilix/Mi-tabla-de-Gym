<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi rutina · Gym</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap">
<style>
:root{--bg:#EEF1F6;--card:#fff;--ink:#101828;--mut:#667085;--line:#E1E6EF;--ok:#12A35F;--okbg:#E3F6EC;--field:#F4F6FA;
--h:'Barlow Condensed','Arial Narrow',Arial,sans-serif;--b:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--c:#2F5BFF;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0C111B;--card:#151C2A;--ink:#F2F4F8;--mut:#9AA4B8;--line:#252E42;--ok:#3DDC97;--okbg:#14352A;--field:#0F1522}}
:root[data-theme="dark"]{--bg:#0C111B;--card:#151C2A;--ink:#F2F4F8;--mut:#9AA4B8;--line:#252E42;--ok:#3DDC97;--okbg:#14352A;--field:#0F1522}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--b);font-size:16px;line-height:1.4}
main{max-width:560px;margin:0 auto;padding:0 14px 40px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:12px 0 8px}
.wk{display:flex;align-items:center;justify-content:space-between;gap:10px}
.wk h1{margin:0;font-family:var(--h);font-weight:800;font-size:30px;line-height:1;letter-spacing:.2px}
.wk small{display:block;font-family:var(--b);font-weight:500;font-size:13px;color:var(--mut);margin-top:3px}
.step{display:flex;align-items:center;gap:6px}
.step button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:22px;font-weight:600}
.step b{font-family:var(--h);font-size:26px;min-width:34px;text-align:center}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px}
.tab{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:8px 2px 7px;font-family:var(--b);text-align:center;position:relative}
.tab b{display:block;font-family:var(--h);font-size:20px;font-weight:700;line-height:1.05}
.tab span{font-size:12px;color:var(--mut)}
.tab[aria-selected=true]{background:var(--c);border-color:var(--c);color:#fff}
.tab[aria-selected=true] span{color:#E8EDFF}
.tab i{position:absolute;left:8px;right:8px;bottom:0;height:3px;border-radius:3px;background:var(--ok);transform-origin:left;transform:scaleX(var(--p,0))}
.hero{background:var(--c);color:#fff;border-radius:20px;padding:18px;margin:10px 0 14px;display:flex;align-items:center;gap:16px}
.ring{--p:0;width:84px;height:84px;border-radius:50%;flex:none;display:grid;place-items:center;background:conic-gradient(#fff calc(var(--p)*1%),rgba(255,255,255,.28) 0)}
.ring div{width:66px;height:66px;border-radius:50%;background:var(--c);display:grid;place-items:center;font-family:var(--h);font-weight:800;font-size:24px}
.hero h2{margin:0;font-family:var(--h);font-weight:800;font-size:34px;line-height:1}
.hero p{margin:4px 0 0;font-size:14px;opacity:.92}
.tools{display:flex;gap:8px;margin-bottom:12px}
.tools button{flex:1;min-height:44px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;font:600 14px var(--b)}
.ex{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;border-left:6px solid var(--c)}
.ex.done{border-left-color:var(--ok)}
.ex h3{margin:0;font-size:17px;font-weight:600;line-height:1.25}
.ex p{margin:2px 0 0;font-size:13px;color:var(--mut)}
.sets{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.set{text-align:center}
.set label{display:block;font-family:var(--h);font-weight:700;font-size:15px;color:var(--mut);margin-bottom:4px}
.set input{width:100%;height:52px;border-radius:12px;border:2px solid var(--line);background:var(--field);color:var(--ink);text-align:center;font:800 22px var(--h);padding:0;-moz-appearance:textfield}
.set input::-webkit-outer-spin-button,.set input::-webkit-inner-spin-button{-webkit-appearance:none}
.set input:focus{outline:none;border-color:var(--c)}
.set input.up{border-color:var(--ok);background:var(--okbg)}
.set small{display:block;margin-top:4px;font-size:12px;color:var(--mut);min-height:16px}
.set small.up{color:var(--ok);font-weight:600}
.how{margin-top:8px;border-top:1px solid var(--line)}
.how summary{min-height:44px;display:flex;align-items:center;color:var(--c);font-weight:600;font-size:15px;cursor:pointer}
.how p{margin:0 0 10px;color:var(--ink);font-size:15px}
.lk{display:flex;gap:8px;margin-bottom:6px}
.lk a{flex:1;text-align:center;padding:11px 6px;border-radius:12px;border:1px solid var(--line);background:var(--field);color:var(--ink);font-weight:600;font-size:14px;text-decoration:none}
.timer{position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);overflow:hidden}
.fill{position:absolute;left:0;top:0;height:100%;width:0;background:var(--okbg)}
.tin{position:relative;max-width:560px;margin:0 auto;padding:10px 14px;display:flex;align-items:center;gap:8px}
.tin>div{flex:1}
.tin small{display:block;font-size:12px;color:var(--mut)}
.tin b{font:800 30px/1 var(--h)}
.tin button{min-width:64px;height:46px;border-radius:12px;border:0;background:var(--c);color:#fff;font:700 16px var(--b)}
.tin button:last-child{background:var(--field);color:var(--ink);min-width:46px;border:1px solid var(--line)}
.pic img{display:block;width:100%;max-height:320px;object-fit:contain;border-radius:12px;background:var(--field);margin:4px 0 8px}
.pbtn{flex:1;text-align:center;padding:11px 6px;border-radius:12px;border:1px dashed var(--c);background:var(--field);color:var(--c);font:600 14px var(--b);cursor:pointer}
button.pbtn{flex:none;padding:11px 16px;border:1px solid var(--line);color:var(--ink)}
.pmsg{color:#D92D20;font-size:13px;margin:0}.pmsg:empty{display:none}
.foot{margin-bottom:90px;font-size:13px;color:var(--mut);text-align:center;margin-top:18px;line-height:1.5}
@media (prefers-reduced-motion:no-preference){.tab i,.ring{transition:all .3s}}
</style>
</head>
<body>
<main>
<div class="top">
  <div class="wk">
    <div><h1>Mi rutina</h1><small id="dates"></small></div>
    <div class="step"><button id="prev" aria-label="Semana anterior">‹</button><b id="wnum">1</b><button id="next" aria-label="Semana siguiente">›</button></div>
  </div>
  <div class="tabs" id="tabs" role="tablist"></div>
</div>
<section id="view"></section>
<div class="timer"><div class="fill" id="tf"></div><div class="tin"><div><small>Descanso</small><b id="tt">—</b></div><button onclick="startT(30)">30 s</button><button onclick="startT(60)">60 s</button><button onclick="stopT()" aria-label="Parar cronómetro">✕</button></div></div>
<p class="foot">Los kg se guardan en este navegador. Abre siempre el mismo enlace desde el mismo móvil para conservarlos.</p>
</main>
<script>
var REPS=[15,12,10,8];
var DAYS=[
{n:'Vía 1',d:'Lunes',m:'Pecho, cuádriceps y abdomen',c:'#2F5BFF',ex:[
['Press inclinado con mancuernas alterno'],['Aperturas declinadas'],['Press sentado en poleas unilateral'],['Extensión de cuádriceps en máquina'],['Sentadilla Sysy'],['Encogimientos alternos']]},
{n:'Vía 2',d:'Martes',m:'Deltoides, bíceps y tríceps',c:'#D9308A',ex:[
['Elevaciones laterales en polea','2 manos'],['Press militar de pie con mancuernas','pro a supi'],['Encogimientos en multipower','trasero'],['Curl de bíceps con barra Z'],['Curl concentrado en banco inclinado'],['Press francés tumbado en polea'],['Press francés sentado con mancuerna','apoyo lumbar']]},
{n:'Vía 3',d:'Jueves',m:'Dorsal, glúteo y femoral',c:'#0E8F7A',ex:[
['Dominadas asistidas en máquina'],['Jalón con agarre cerrado'],['Remo en punta landmine o máquina'],['Zancada granjera con mancuernas'],['Femoral de pie'],['Peso muerto con barra']]},
{n:'Vía 4',d:'Viernes',m:'Pecho, tríceps y abdomen',c:'#E26A00',ex:[
['Press inclinado en banco con mancuernas','giro arriba'],['Cruces en polea a la altura de la clavícula'],['Patadas de tríceps inclinado, 2 brazos'],['Flexiones para tríceps'],['Encogimientos con disco'],['Elevación de piernas + pelvis']]}
];
var TIPS=[["Banco a 30°. Baja una mancuerna hasta el pecho mientras la otra queda arriba y alterna sin rebotar, con los codos a unos 45°.","Codos ligeramente flexionados. Abre en arco hasta notar el estiramiento del pecho y cierra como si abrazaras un árbol.","Espalda apoyada. Empuja con un brazo al frente sin girar el tronco y vuelve despacio sin soltar la tensión.","Espalda pegada al respaldo. Extiende hasta casi bloquear la rodilla, aprieta arriba y baja controlando unos 2 s.","Mantén el tronco estable y las rodillas alineadas con los pies. Baja con control y sube empujando con los cuádriceps. Si no la dominas, pide al monitor que te la enseñe.","Tumbado con las rodillas flexionadas. Sube el tronco llevando un hombro hacia la rodilla contraria, sin tirar del cuello."],
["Codo ligeramente flexionado. Sube el brazo hasta la altura del hombro, sin balanceo, y baja lento.","Empieza con las palmas hacia ti y gira a palmas al frente al subir. Abdomen apretado y sin arquear la lumbar.","Barra detrás del cuerpo. Sube los hombros hacia las orejas, pausa 1 s y baja sin rotarlos.","Codos pegados al cuerpo. Sube sin balancear y baja controlando.","Brazo colgando. Sube girando la muñeca, aprieta arriba y baja despacio hasta casi estirar.","Codos fijos apuntando al techo. Flexiona solo el antebrazo hasta la frente y extiende.","Espalda apoyada en el respaldo. Baja la mancuerna detrás de la cabeza con los codos cerrados y extiende."],
["Agarre algo más ancho que los hombros. Lleva el pecho hacia la barra con las escápulas abajo y baja completo.","Pecho alto. Tira hasta la parte alta del pecho llevando los codos hacia abajo, sin balancearte.","Espalda recta y cadera atrás. Tira del codo hacia la cadera y aprieta la espalda.","Mancuernas a los lados, paso largo, rodilla delantera sobre el pie y tronco recto. Empuja con el talón.","Cadera quieta. Flexiona la rodilla llevando el talón al glúteo, aprieta y baja lento.","Barra pegada a las piernas y espalda neutra. Empuja el suelo, extiende la cadera y baja con la cadera hacia atrás."],
["Banco inclinado. Empieza con las palmas hacia ti y gira hasta palmas al frente al subir.","Poleas a la altura de la clavícula. Cierra los brazos al frente sin encoger los hombros.","Tronco inclinado y codos pegados al cuerpo. Extiende ambos brazos hacia atrás y aprieta el tríceps.","Manos cerca del pecho y codos pegados al cuerpo al bajar. Sube estirando bien los brazos.","Tumbado con el disco en el pecho. Sube el tronco contrayendo el abdomen, sin tirar del cuello.","Tumbado. Sube las piernas y, al llegar arriba, eleva la pelvis. Baja sin arquear la lumbar."]];
var START=new Date(2026,7,31),KEY='gym-rutina-v1',store={};
try{store=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){store={}}
if(!store.kg)store.kg={};
function save(){try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){}}
var today=new Date(),wk=Math.max(1,Math.floor((today-START)/604800000)+1);
var wd=today.getDay(),day=({1:0,2:1,4:2,5:3})[wd];if(day===undefined)day=0;
function k(w,d,e,s){return w+'-'+d+'-'+e+'-'+s}
function tech(n,t,d,e){var q=encodeURIComponent(n+' técnica');return '<details class="how"><summary>Cómo hacerlo</summary><p>'+t+'</p><div class="lk"><a target="_blank" rel="noopener" href="https://www.youtube.com/results?search_query='+q+'">Ver vídeo</a><a target="_blank" rel="noopener" href="https://www.google.com/search?tbm=isch&q='+q+'">Ver imágenes</a></div><div class="pic" id="pic'+d+'-'+e+'">'+picHTML(d,e)+'</div></details>'}
var PK='gym-fotos-v1',photos={};
try{photos=JSON.parse(localStorage.getItem(PK)||'{}')}catch(e){photos={}}
function savePh(){try{localStorage.setItem(PK,JSON.stringify(photos));return true}catch(e){return false}}
function picHTML(d,e){var id=d+'-'+e,p=photos[id];return (p?'<img src="'+p+'" alt="Mi foto del ejercicio">':'')+'<div class="lk"><label class="pbtn">'+(p?'Cambiar mi foto':'Subir mi foto')+'<input type="file" accept="image/*" hidden data-id="'+id+'"></label>'+(p?'<button class="pbtn" data-del="'+id+'">Quitar</button>':'')+'</div><p class="pmsg" id="pm'+id+'"></p>'}
function refreshPic(id){var p=id.split('-');document.getElementById('pic'+id).innerHTML=picHTML(+p[0],+p[1])}
function pmsg(id,t){var m=document.getElementById('pm'+id);if(m)m.textContent=t}
document.addEventListener('change',function(ev){var t=ev.target;if(t.type!=='file'||!t.dataset.id)return;var f=t.files[0];if(!f)return;var id=t.dataset.id,img=new Image(),u=URL.createObjectURL(f);
img.onload=function(){var s=Math.min(1,720/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);var old=photos[id];photos[id]=c.toDataURL('image/jpeg',.72);if(!savePh()){if(old)photos[id]=old;else delete photos[id];pmsg(id,'No hay espacio para guardar más fotos. Quita alguna que no uses.');return}refreshPic(id)};
img.onerror=function(){pmsg(id,'No he podido leer esa imagen. Prueba con otra foto.')};img.src=u});
document.addEventListener('click',function(ev){var id=ev.target.dataset&&ev.target.dataset.del;if(!id)return;delete photos[id];savePh();refreshPic(id)});
var tEnd=0,tTot=0,tInt=null,actx=null;
function beep(){try{var o=actx.createOscillator(),g=actx.createGain();o.connect(g);g.connect(actx.destination);o.frequency.value=880;g.gain.value=.2;o.start();o.stop(actx.currentTime+.4)}catch(e){}try{if(navigator.vibrate)navigator.vibrate([300,150,300])}catch(e){}}
function startT(s){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)()}catch(e){}clearInterval(tInt);tTot=s;tEnd=Date.now()+s*1000;tick();tInt=setInterval(tick,200)}
function stopT(){clearInterval(tInt);tInt=null;document.getElementById('tt').textContent='—';document.getElementById('tf').style.width='0'}
function tick(){var r=Math.ceil((tEnd-Date.now())/1000),f=document.getElementById('tf');if(r<=0){clearInterval(tInt);tInt=null;document.getElementById('tt').textContent='¡Ya!';f.style.width='100%';beep();return}document.getElementById('tt').textContent='0:'+(r<10?'0':'')+r;f.style.width=((tTot-r)/tTot*100)+'%'}
function val(w,d,e,s){var v=store.kg[k(w,d,e,s)];return v===undefined?'':v}
function num(v){var n=parseFloat(String(v).replace(',','.'));return isNaN(n)?null:n}
function stats(w,d){var t=DAYS[d].ex.length*4,f=0;DAYS[d].ex.forEach(function(x,e){for(var s=0;s<4;s++)if(val(w,d,e,s)!=='')f++});return{t:t,f:f,p:Math.round(f/t*100)}}
function fmt(dt){return dt.toLocaleDateString('es-ES',{day:'numeric',month:'short'})}
function head(){
  document.getElementById('wnum').textContent=wk;
  var a=new Date(START.getTime()+(wk-1)*604800000),b=new Date(a.getTime()+6*86400000);
  document.getElementById('dates').textContent='Semana '+wk+' · '+fmt(a)+' – '+fmt(b);
  var h='';DAYS.forEach(function(D,i){h+='<button class="tab" role="tab" data-d="'+i+'" aria-selected="'+(i===day)+'" style="--p:'+stats(wk,i).p/100+'"><b>'+D.n+'</b><span>'+D.d.slice(0,3)+'</span><i></i></button>'});
  document.getElementById('tabs').innerHTML=h;
  document.querySelectorAll('.tab').forEach(function(t){t.onclick=function(){day=+t.dataset.d;render()}});
  var D=DAYS[day];document.getElementById('tabs').style.setProperty('--c',D.c);
}
function render(){
  var D=DAYS[day];document.documentElement.style.setProperty('--c',D.c);head();
  var s=stats(wk,day);
  var h='<div class="hero"><div class="ring" id="ring" style="--p:'+s.p+'"><div id="rp">'+s.p+'%</div></div><div><h2>'+D.n+' · '+D.d+'</h2><p>'+D.m+'</p><p id="rc">'+s.f+' de '+s.t+' series anotadas</p></div></div>';
  h+='<div class="tools"><button id="copy">Copiar kg de la semana anterior</button></div>';
  D.ex.forEach(function(x,e){
    h+='<article class="ex" id="ex'+e+'"><h3>'+x[0]+'</h3><p>4 series · descanso 30/60 s'+(x[1]?' · '+x[1]:'')+'</p>'+tech(x[0],TIPS[day][e],day,e)+'<div class="sets">';
    for(var i=0;i<4;i++){
      var pv=wk>1?val(wk-1,day,e,i):'';
      h+='<div class="set"><label for="i'+e+i+'">'+REPS[i]+' rep</label><input id="i'+e+i+'" type="text" inputmode="decimal" autocomplete="off" placeholder="kg" data-e="'+e+'" data-s="'+i+'" value="'+val(wk,day,e,i)+'"><small id="s'+e+i+'">'+(pv!==''?'Antes: '+pv:'')+'</small></div>';
    }
    h+='</div></article>';
  });
  document.getElementById('view').innerHTML=h;
  document.querySelectorAll('.set input').forEach(function(inp){
    mark(inp);
    inp.addEventListener('input',function(){
      var e=+inp.dataset.e,i=+inp.dataset.s,v=inp.value.trim();
      if(v==='')delete store.kg[k(wk,day,e,i)];else store.kg[k(wk,day,e,i)]=v;
      save();mark(inp);upd();
    });
  });
  document.getElementById('copy').onclick=function(){
    if(wk<2)return;
    DAYS[day].ex.forEach(function(x,e){for(var i=0;i<4;i++){var p=val(wk-1,day,e,i);if(p!==''&&val(wk,day,e,i)==='')store.kg[k(wk,day,e,i)]=p}});
    save();render();
  };
  upd();
}
function mark(inp){
  var e=+inp.dataset.e,i=+inp.dataset.s,n=num(inp.value),p=wk>1?num(val(wk-1,day,e,i)):null,sm=document.getElementById('s'+e+i);
  var up=n!==null&&p!==null&&n>p;
  inp.classList.toggle('up',up);sm.classList.toggle('up',up);
  if(up)sm.textContent='+'+(Math.round((n-p)*100)/100)+' kg';
  else sm.textContent=p!==null?'Antes: '+val(wk-1,day,e,i):'';
}
function upd(){
  var s=stats(wk,day);
  document.getElementById('ring').style.setProperty('--p',s.p);
  document.getElementById('rp').textContent=s.p+'%';
  document.getElementById('rc').textContent=s.f+' de '+s.t+' series anotadas';
  DAYS[day].ex.forEach(function(x,e){var ok=true;for(var i=0;i<4;i++)if(val(wk,day,e,i)==='')ok=false;document.getElementById('ex'+e).classList.toggle('done',ok)});
  var t=document.querySelector('.tab[data-d="'+day+'"]');if(t)t.style.setProperty('--p',s.p/100);
}
document.getElementById('prev').onclick=function(){if(wk>1){wk--;render()}};
document.getElementById('next').onclick=function(){if(wk<20){wk++;render()}};
render();
</script>
</body>
</html>
